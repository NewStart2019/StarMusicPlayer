<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="50%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <radialGradient id="sun" cx="35%" cy="28%" r="40%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="720" cy="260" r="280" fill="url(#sun)" filter="url(#blur)"/>
  <ellipse cx="420" cy="360" rx="320" ry="140" fill="url(#cloud)" filter="url(#blur)"/>
  <ellipse cx="1100" cy="320" rx="360" ry="150" fill="url(#cloud)" filter="url(#blur)"/>
  <ellipse cx="1460" cy="420" rx="300" ry="120" fill="url(#cloud)" filter="url(#blur)"/>
  <rect y="820" width="1920" height="300" fill="#c7d2fe" fill-opacity="0.35"/>
  <rect y="900" width="1920" height="180" fill="#a5b4fc" fill-opacity="0.35"/>
</svg>
